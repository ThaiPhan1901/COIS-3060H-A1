name: MSR Guide CI

on:
  push:
    branches: [main, "feature/**", "test/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests
        run: npm test
